name: P4 Batch 2 T1C gap delta verification on unified candidate GHCR digest

on:
  workflow_dispatch:
    inputs:
      app_image_digest:
        description: 'Immutable GHCR candidate digest (ghcr.io/nobita6986/crm-cskh@sha256:...)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: p4-batch2-delta-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_IMAGE_DIGEST: ${{ inputs.app_image_digest }}
  BASELINE_MAIN_COMMIT_SHA: '467830195358b2431ac772486530ab935887a518'

jobs:
  static-and-lock-gate:
    name: PR isolation, release-lock integrity, ruff & Batch 2 unit contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify digest URI, PR isolation, locks, ruff & unit contracts
        shell: bash
        run: |
          set -euo pipefail
          sh deploy/release/validate_digest_uri.sh "${TARGET_IMAGE_DIGEST}"

          python3 deploy/release/verify_pr_isolation.py \
            --check-workflows \
            --check-runtime-env \
            --check-locks

          python3 -m venv "$RUNNER_TEMP/lint-venv"
          "$RUNNER_TEMP/lint-venv/bin/pip" install --no-cache-dir ruff==0.14.0 cryptography==44.0.2
          "$RUNNER_TEMP/lint-venv/bin/ruff" check deploy/release
          "$RUNNER_TEMP/lint-venv/bin/ruff" format --check deploy/release
          "$RUNNER_TEMP/lint-venv/bin/python" -m unittest discover -s deploy/release -p 'test_*.py' -v

  g06-g09-migration-and-rollback:
    name: G06 & G09 — N-1 clone migration, migrate x2, Tier 1-3 rollback & Tier 4 DR restore
    needs: [static-and-lock-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    steps:
      - name: Reclaim unused runner SDK space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          df -h

      - name: Checkout repository with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Build N-1 image from baseline main & pull unified candidate @sha256 from GHCR
        shell: bash
        env:
          GITHUB_ACTOR_PULL: ${{ github.actor }}
          GITHUB_TOKEN_READONLY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p4-batch2-g06-g09/n-minus-1-build"
          sh deploy/release/validate_digest_uri.sh "${TARGET_IMAGE_DIGEST}"

          printf '%s\n' "${GITHUB_TOKEN_READONLY}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR_PULL}" \
            --password-stdin
          docker pull "${TARGET_IMAGE_DIGEST}"
          docker logout ghcr.io >/dev/null 2>&1 || true

          IMG_REV="$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${TARGET_IMAGE_DIGEST}")"
          HEAD_REV="$(git rev-parse HEAD)"
          test "${IMG_REV}" = "${HEAD_REV}"

          git worktree add --detach "$RUNNER_TEMP/n-minus-1-src" "${BASELINE_MAIN_COMMIT_SHA}"
          REGISTRY_PUSH=false \
          bash "$RUNNER_TEMP/n-minus-1-src/deploy/images/build-image.sh" \
            --out-dir "$RUNNER_TEMP/p4-batch2-g06-g09/n-minus-1-build" \
            --tag "cskh-n-minus-1:local"
          git worktree remove --force "$RUNNER_TEMP/n-minus-1-src"

      - name: Run G06 & G09 live N-1 -> N migration, idempotency & 4-tier rollback rehearsal
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/p4-batch2-g06-g09"
          python3 deploy/release/batch2_delta/verify_g06_g09_migration_and_rollback.py \
            --n-minus-1-image "cskh-n-minus-1:local" \
            --candidate-image "${TARGET_IMAGE_DIGEST}" \
            --http-port 18910 \
            --dr-http-port 18911 \
            --report-out "$OUT_DIR/g06-g09-migration-and-rollback-report.json" \
            --log-out "$OUT_DIR/g06-g09-execution.log"
          cp deploy/release/batch2-t1c-gap-matrix.md "$OUT_DIR/batch2-t1c-gap-matrix.md"
          (
            cd "$OUT_DIR"
            find . -type f ! -name 'SHA256SUMS.txt' | LC_ALL=C sort | sed 's|^\./||' | xargs sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Upload G06 & G09 evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p4-batch2-g06-g09-${{ github.run_id }}
          path: ${{ runner.temp }}/p4-batch2-g06-g09/
          if-no-files-found: error
          retention-days: 30

  g11-g12-security-and-topology:
    name: G11 & G12 — Current-topology session/Socket.IO revocation & S01-S20 security controls
    needs: [static-and-lock-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Reclaim unused runner SDK space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Pull unified candidate @sha256 from GHCR & assert revision parity (pull-only)
        shell: bash
        env:
          GITHUB_ACTOR_PULL: ${{ github.actor }}
          GITHUB_TOKEN_READONLY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sh deploy/release/validate_digest_uri.sh "${TARGET_IMAGE_DIGEST}"
          printf '%s\n' "${GITHUB_TOKEN_READONLY}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR_PULL}" \
            --password-stdin
          docker pull "${TARGET_IMAGE_DIGEST}"
          docker logout ghcr.io >/dev/null 2>&1 || true

          IMG_REV="$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${TARGET_IMAGE_DIGEST}")"
          HEAD_REV="$(git rev-parse HEAD)"
          test "${IMG_REV}" = "${HEAD_REV}"

      - name: Run G11 & G12 live topology revocation, rate-limit, payload-limit, audit & export verification
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/p4-batch2-g11-g12"
          mkdir -p "$OUT_DIR"
          python3 deploy/release/batch2_delta/verify_g11_g12_security_topology.py \
            --app-image "${TARGET_IMAGE_DIGEST}" \
            --http-port 18920 \
            --report-out "$OUT_DIR/g11-g12-security-topology-report.json" \
            --log-out "$OUT_DIR/g11-g12-execution.log"
          cp deploy/release/batch2_delta/compose.cskh-edge-ratelimit.yaml "$OUT_DIR/compose.cskh-edge-ratelimit.yaml"
          (
            cd "$OUT_DIR"
            find . -type f ! -name 'SHA256SUMS.txt' | LC_ALL=C sort | sed 's|^\./||' | xargs sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Upload G11 & G12 evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p4-batch2-g11-g12-${{ github.run_id }}
          path: ${{ runner.temp }}/p4-batch2-g11-g12/
          if-no-files-found: error
          retention-days: 30

  g13-g14-g15-g17-e2e-golden-chaos:
    name: G13-G15 & G17 — Golden dataset cskh-metrics-v2, P1-P3 HTTP delta & worker SIGKILL recovery
    needs: [static-and-lock-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    steps:
      - name: Reclaim unused runner SDK space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Pull unified candidate @sha256 from GHCR & assert revision parity (pull-only)
        shell: bash
        env:
          GITHUB_ACTOR_PULL: ${{ github.actor }}
          GITHUB_TOKEN_READONLY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sh deploy/release/validate_digest_uri.sh "${TARGET_IMAGE_DIGEST}"
          printf '%s\n' "${GITHUB_TOKEN_READONLY}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR_PULL}" \
            --password-stdin
          docker pull "${TARGET_IMAGE_DIGEST}"
          docker logout ghcr.io >/dev/null 2>&1 || true

          IMG_REV="$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${TARGET_IMAGE_DIGEST}")"
          HEAD_REV="$(git rev-parse HEAD)"
          test "${IMG_REV}" = "${HEAD_REV}"

      - name: Run G15 Golden Dataset, G13/G14 HTTP E2E delta & G17 worker SIGKILL chaos suite
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/p4-batch2-g13-g17"
          mkdir -p "$OUT_DIR"
          python3 deploy/release/batch2_delta/verify_g13_g14_g15_g17_delta.py \
            --app-image "${TARGET_IMAGE_DIGEST}" \
            --http-port 18930 \
            --report-out "$OUT_DIR/g13-g14-g15-g17-delta-report.json" \
            --log-out "$OUT_DIR/g13-g14-g15-g17-execution.log"
          (
            cd "$OUT_DIR"
            find . -type f ! -name 'SHA256SUMS.txt' | LC_ALL=C sort | sed 's|^\./||' | xargs sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Upload G13-G15 & G17 evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p4-batch2-g13-g17-${{ github.run_id }}
          path: ${{ runner.temp }}/p4-batch2-g13-g17/
          if-no-files-found: error
          retention-days: 30
