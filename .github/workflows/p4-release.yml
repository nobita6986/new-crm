name: P4-02 build-once release, verify-by-digest & Staging promotion

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Canonical release ID (e.g. crm-cskh-20261106-001)"
        required: true
        type: string
      previous_release_id:
        description: "Previous Production release ID (empty on initial Go-Live)"
        required: false
        default: ""
        type: string
  push:
    tags:
      - 'release-v*'

permissions:
  contents: read

concurrency:
  group: p4-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight-and-registry-gate:
    name: Verify lock invariants & approved registry configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
      previous_release_id: ${{ steps.meta.outputs.previous_release_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Audit workflows & release lock integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p4-release-preflight"
          python3 -m venv "$RUNNER_TEMP/p4-venv"
          "$RUNNER_TEMP/p4-venv/bin/pip" install --no-cache-dir cryptography==44.0.2
          "$RUNNER_TEMP/p4-venv/bin/python" deploy/release/verify_pr_isolation.py \
            --check-workflows \
            --check-locks \
            --out "$RUNNER_TEMP/p4-release-preflight/isolation-audit.json"

      - name: Fail-closed gate on approved Container Registry & public verification key
        id: meta
        shell: bash
        env:
          CSKH_REGISTRY_IMAGE: ${{ vars.CSKH_REGISTRY_IMAGE }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_PREV_ID: ${{ inputs.previous_release_id }}
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/p4-release-preflight"
          REL_ID="${INPUT_RELEASE_ID:-crm-cskh-${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}}"
          echo "release_id=${REL_ID}" >> "$GITHUB_OUTPUT"
          echo "previous_release_id=${INPUT_PREV_ID}" >> "$GITHUB_OUTPUT"

          if [ -z "${CSKH_REGISTRY_IMAGE}" ] || [ -z "${RELEASE_SIGNING_PUBLIC_KEY}" ]; then
            python3 - "$OUT_DIR/blocked-registry-prereq.json" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path

          report = {
              "status": "BLOCKED",
              "blocker_id": "BLK-INFRA-03",
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "missing_configuration": [
                  k for k in ("CSKH_REGISTRY_IMAGE", "RELEASE_SIGNING_PUBLIC_KEY")
                  if not os.environ.get(k, "").strip()
              ],
              "detail": (
                  "Approved Container Registry repository variable (vars.CSKH_REGISTRY_IMAGE) and/or "
                  "Ed25519 verification key (vars.RELEASE_SIGNING_PUBLIC_KEY) are not provisioned yet. "
                  "Refusing to run release build-once without an approved registry."
              ),
          }
          Path(sys.argv[1]).write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2), file=sys.stderr)
          PY
            exit 1
          fi

      - name: Upload preflight status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p4-release-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/p4-release-preflight/
          if-no-files-found: warn
          retention-days: 30

  build-once-sign-and-push:
    name: Build-once, push @sha256, SBOM, strict CVE gate & Ed25519 sign
    needs: [preflight-and-registry-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: registry-build
    permissions:
      contents: read
      packages: write
    outputs:
      app_image_digest: ${{ steps.build.outputs.app_image_digest }}
      actual_head_sha: ${{ steps.build.outputs.actual_head_sha }}
      release_id: ${{ needs.preflight-and-registry-gate.outputs.release_id }}

    steps:
      - name: Reclaim unused runner SDK space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare isolated release bundle directory & signing virtualenv
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            "$RUNNER_TEMP/p4-release-bundle/build" \
            "$RUNNER_TEMP/p4-release-bundle/sbom" \
            "$RUNNER_TEMP/p4-release-bundle/security" \
            "$RUNNER_TEMP/p4-release-bundle/manifest"
          python3 -m venv "$RUNNER_TEMP/p4-venv"
          "$RUNNER_TEMP/p4-venv/bin/pip" install --no-cache-dir cryptography==44.0.2

      - name: Authenticate push-only robot account to approved Container Registry
        shell: bash
        env:
          CSKH_REGISTRY_IMAGE: ${{ vars.CSKH_REGISTRY_IMAGE }}
          REGISTRY_PUSH_USERNAME: ${{ secrets.REGISTRY_PUSH_USERNAME }}
          REGISTRY_PUSH_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          REGISTRY_HOST="${CSKH_REGISTRY_IMAGE%%/*}"
          if [ -z "${REGISTRY_PUSH_USERNAME}" ] || [ -z "${REGISTRY_PUSH_TOKEN}" ]; then
            echo "ERROR: Missing REGISTRY_PUSH_USERNAME / REGISTRY_PUSH_TOKEN in registry-build environment" >&2
            exit 1
          fi
          printf '%s\n' "${REGISTRY_PUSH_TOKEN}" | docker login "${REGISTRY_HOST}" \
            --username "${REGISTRY_PUSH_USERNAME}" \
            --password-stdin

      - name: Build custom production image ONCE & push to approved registry
        id: build
        shell: bash
        env:
          CSKH_REGISTRY_IMAGE: ${{ vars.CSKH_REGISTRY_IMAGE }}
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/p4-release-bundle"
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          REL_TAG="0.0.1-${ACTUAL_HEAD_SHA::12}"

          PYTHON_BIN="$RUNNER_TEMP/p4-venv/bin/python" \
          LOCAL_IMAGE_REPO="${CSKH_REGISTRY_IMAGE}" \
          REGISTRY_PUSH=true \
          CSKH_REGISTRY_IMAGE="${CSKH_REGISTRY_IMAGE}" \
          bash deploy/images/build-image.sh \
            --out-dir "$BUNDLE/build" \
            --tag "${REL_TAG}"

          APP_IMAGE_DIGEST="$(jq -r '.registry_verification.approved_registry_repo_digest' \
            "$BUNDLE/build/image-inspect-summary.json")"
          echo "${APP_IMAGE_DIGEST}" | grep -Eq '^[^@\s]+@sha256:[0-9a-f]{64}$'

          echo "app_image_digest=${APP_IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "actual_head_sha=${ACTUAL_HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX 1.5 & SPDX 2.3 SBOMs and enforce strict Trivy CVE/secret gate
        shell: bash
        env:
          APP_IMAGE_DIGEST: ${{ steps.build.outputs.app_image_digest }}
          TRIVY_IMAGE: aquasec/trivy:0.58.2@sha256:665030f4d33a82c1e8d9d5e0453365842236723c1ee5cc3becca698268e66a56
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/p4-release-bundle"
          PY="$RUNNER_TEMP/p4-venv/bin/python"

          "$PY" deploy/release/generate_sbom.py \
            --metadata-dir "$BUNDLE/build" \
            --image-ref "${APP_IMAGE_DIGEST}" \
            --cyclonedx-out "$BUNDLE/sbom/sbom.cyclonedx.json" \
            --spdx-out "$BUNDLE/sbom/sbom.spdx.json" \
            > "$BUNDLE/sbom/sbom-summary.json"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$BUNDLE/security:/scan-out" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
            "${TRIVY_IMAGE}" \
            image \
            --image-src docker \
            --db-repository "public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2" \
            --scanners vuln,secret \
            --format json \
            --timeout 15m \
            --output /scan-out/trivy-image.json \
            "${APP_IMAGE_DIGEST}"

          # Strict release gate: fails closed on ANY secret OR unapproved fixable CRITICAL CVE
          "$PY" deploy/release/evaluate_security_scan.py \
            --trivy-json "$BUNDLE/security/trivy-image.json" \
            --out "$BUNDLE/security/security-scan-summary.json"

      - name: Generate & Ed25519-sign canonical release-manifest.json (production_candidate)
        shell: bash
        env:
          APP_IMAGE_DIGEST: ${{ steps.build.outputs.app_image_digest }}
          RELEASE_ID: ${{ needs.preflight-and-registry-gate.outputs.release_id }}
          PREVIOUS_RELEASE_ID: ${{ needs.preflight-and-registry-gate.outputs.previous_release_id }}
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/p4-release-bundle"
          PY="$RUNNER_TEMP/p4-venv/bin/python"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          "$PY" deploy/release/release_manifest.py generate \
            --release-id "${RELEASE_ID}" \
            --environment-scope production_candidate \
            --previous-release-id "${PREVIOUS_RELEASE_ID}" \
            --build-manifest "$BUNDLE/build/build-manifest.json" \
            --image-inspect "$BUNDLE/build/image-inspect-summary.json" \
            --sbom-cyclonedx "$BUNDLE/sbom/sbom.cyclonedx.json" \
            --sbom-spdx "$BUNDLE/sbom/sbom.spdx.json" \
            --security-scan "$BUNDLE/security/security-scan-summary.json" \
            --build-url "${RUN_URL}" \
            --test-report-url "${RUN_URL}" \
            --out "$BUNDLE/manifest/release-manifest.json"

          "$PY" deploy/release/release_manifest.py sign \
            --manifest "$BUNDLE/manifest/release-manifest.json" \
            --private-key-env RELEASE_SIGNING_PRIVATE_KEY \
            --sig-out "$BUNDLE/manifest/release-manifest.json.sig" \
            --envelope-out "$BUNDLE/manifest/release-manifest.envelope.json"

          "$PY" deploy/release/release_manifest.py verify \
            --manifest "$BUNDLE/manifest/release-manifest.json" \
            --sig "$BUNDLE/manifest/release-manifest.json.sig" \
            --public-key-env RELEASE_SIGNING_PUBLIC_KEY \
            --expected-image "${APP_IMAGE_DIGEST}" \
            --expected-scope production_candidate

      - name: Logout from registry & upload signed release bundle
        if: always()
        shell: bash
        env:
          CSKH_REGISTRY_IMAGE: ${{ vars.CSKH_REGISTRY_IMAGE }}
        run: |
          REGISTRY_HOST="${CSKH_REGISTRY_IMAGE%%/*}"
          docker logout "${REGISTRY_HOST}" >/dev/null 2>&1 || true

      - name: Upload signed release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p4-release-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/p4-release-bundle/
          if-no-files-found: error
          retention-days: 90

  verify-by-digest:
    name: Pull @sha256 on fresh runner, G02 clean-site, G03 Compose smoke & G04 P0-P3 suites
    needs: [build-once-sign-and-push]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read

    steps:
      - name: Reclaim unused runner SDK space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download signed release bundle from build-once job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p4-release-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/p4-release-bundle

      - name: Verify Ed25519 signature BEFORE pulling image (zero build cache on fresh runner)
        shell: bash
        env:
          APP_IMAGE_DIGEST: ${{ needs.build-once-sign-and-push.outputs.app_image_digest }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p4-verify-evidence/junit" "$RUNNER_TEMP/p4-verify-evidence/junit-ui"
          python3 -m venv "$RUNNER_TEMP/p4-venv"
          "$RUNNER_TEMP/p4-venv/bin/pip" install --no-cache-dir cryptography==44.0.2
          "$RUNNER_TEMP/p4-venv/bin/python" deploy/release/release_manifest.py verify \
            --manifest "$RUNNER_TEMP/p4-release-bundle/manifest/release-manifest.json" \
            --sig "$RUNNER_TEMP/p4-release-bundle/manifest/release-manifest.json.sig" \
            --public-key-env RELEASE_SIGNING_PUBLIC_KEY \
            --expected-image "${APP_IMAGE_DIGEST}" \
            --expected-scope production_candidate

      - name: Pull immutable @sha256 image digest (read-only registry access)
        shell: bash
        env:
          CSKH_REGISTRY_IMAGE: ${{ vars.CSKH_REGISTRY_IMAGE }}
          CSKH_REGISTRY_PULL_USERNAME: ${{ vars.CSKH_REGISTRY_PULL_USERNAME }}
          GITHUB_ACTOR_FALLBACK: ${{ github.actor }}
          GITHUB_TOKEN_READONLY: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE_DIGEST: ${{ needs.build-once-sign-and-push.outputs.app_image_digest }}
        run: |
          set -euo pipefail
          REGISTRY_HOST="${CSKH_REGISTRY_IMAGE%%/*}"
          if [ "${REGISTRY_HOST}" = "ghcr.io" ]; then
            printf '%s\n' "${GITHUB_TOKEN_READONLY}" | docker login ghcr.io \
              --username "${CSKH_REGISTRY_PULL_USERNAME:-${GITHUB_ACTOR_FALLBACK}}" \
              --password-stdin
          fi
          docker pull "${APP_IMAGE_DIGEST}"

      - name: Run G02 clean-site & G03 10-service Compose smoke on pulled @sha256 digest
        shell: bash
        env:
          APP_IMAGE_DIGEST: ${{ needs.build-once-sign-and-push.outputs.app_image_digest }}
          ACTUAL_HEAD_SHA: ${{ needs.build-once-sign-and-push.outputs.actual_head_sha }}
        run: |
          set -euo pipefail
          VERIFY_OUT="$RUNNER_TEMP/p4-verify-evidence"

          python3 deploy/images/verify_clean_site.py \
            --app-image "${APP_IMAGE_DIGEST}" \
            --pull-policy always \
            --port 18780 \
            --out "$VERIFY_OUT/clean-site-verify.json"

          python3 deploy/compose/scripts/run_isolated_smoke.py \
            --app-image "${APP_IMAGE_DIGEST}" \
            --image-git-sha "${ACTUAL_HEAD_SHA}" \
            --http-port 18080 \
            --report-out "$VERIFY_OUT/isolated-smoke-report.json" \
            --log-out "$VERIFY_OUT/isolated-smoke.log"

      - name: Run P0-P3 Frappe test suites inside pulled @sha256 image (zero apps/ bind-mounts)
        shell: bash
        env:
          APP_IMAGE_DIGEST: ${{ needs.build-once-sign-and-push.outputs.app_image_digest }}
        run: |
          set -euo pipefail
          VERIFY_OUT="$RUNNER_TEMP/p4-verify-evidence"
          SEC_DIR="$RUNNER_TEMP/p4-suite-secrets"
          mkdir -p "${SEC_DIR}"
          DB_PW="$(openssl rand -hex 24)"
          ADM_PW="P4Suite#$(openssl rand -hex 12)"
          printf '%s\n' "${DB_PW}" > "${SEC_DIR}/db_pw.txt"
          chmod 600 "${SEC_DIR}/db_pw.txt"

          export COMPOSE_PROJECT_NAME="cskh-p4-suites-${GITHUB_RUN_ID}"
          export APP_IMAGE="${APP_IMAGE_DIGEST}"
          export PULL_POLICY="never"
          export SITE_NAME="p4-suites.localhost"
          export VERIFY_HTTP_PORT="18880"
          export DB_PASSWORD_SECRETS_FILE="${SEC_DIR}/db_pw.txt"

          cleanup() {
            docker compose -f deploy/images/compose.verify.yaml -p "${COMPOSE_PROJECT_NAME}" \
              down -v --remove-orphans >/dev/null 2>&1 || true
            rm -rf "${SEC_DIR}"
          }
          trap cleanup EXIT

          docker compose -f deploy/images/compose.verify.yaml -p "${COMPOSE_PROJECT_NAME}" up -d
          docker compose -f deploy/images/compose.verify.yaml -p "${COMPOSE_PROJECT_NAME}" exec -T \
            -e DB_PW="${DB_PW}" -e ADM_PW="${ADM_PW}" backend bash -lc '
              set -euo pipefail
              cd /home/frappe/frappe-bench
              ./env/bin/pip install --no-cache-dir unittest-xml-reporting==3.2.0
              bench new-site \
                --db-root-password "${DB_PW}" \
                --admin-password "${ADM_PW}" \
                --mariadb-user-host-login-scope=% \
                --install-app crm \
                --install-app crm_cskh \
                p4-suites.localhost
              bench --site p4-suites.localhost set-config allow_tests true
              bench --site p4-suites.localhost migrate
              bench --site p4-suites.localhost migrate
              mkdir -p /tmp/p4-junit /tmp/p4-junit-ui
            '

          MODULES=(
            crm_cskh.tests.test_permissions
            crm_cskh.tests.test_security_remediation
            crm_cskh.tests.test_security_remediation_v2
            crm_cskh.tests.test_bt1c5_matrix_gaps
            crm_cskh.tests.test_docshare_lifecycle
            crm_cskh.tests.test_p1_lead_import
            crm_cskh.tests.test_p1_dedup_merge
            crm_cskh.tests.test_p1_distribution
            crm_cskh.tests.test_p1_work_item_lifecycle
            crm_cskh.tests.test_p1_contact_attempt
            crm_cskh.tests.test_p1_telesale_api
            crm_cskh.tests.test_p1_security_and_scope
            crm_cskh.tests.test_p2_campaign_targets_and_policy
            crm_cskh.tests.test_p2_dashboard_and_drilldown
            crm_cskh.tests.test_p2_reconciliation
            crm_cskh.tests.test_p3_calendar
            crm_cskh.tests.test_p3_sla_and_attribution
            crm_cskh.tests.test_p3_kpi_and_snapshots
            crm_cskh.tests.test_p3_reporting_and_security
            crm_cskh.tests.test_p3_t1c_remediation
          )
          for mod in "${MODULES[@]}"; do
            slug="${mod##*.}"
            docker compose -f deploy/images/compose.verify.yaml -p "${COMPOSE_PROJECT_NAME}" exec -T \
              -e CI=true backend bash -lc \
              "cd /home/frappe/frappe-bench && bench --site p4-suites.localhost --verbose run-tests --module '${mod}' --junit-xml-output '/tmp/p4-junit/${slug}.junit.xml'"
          done

          docker compose -f deploy/images/compose.verify.yaml -p "${COMPOSE_PROJECT_NAME}" exec -T \
            -e CI=true backend bash -lc \
            "cd /home/frappe/frappe-bench && bench --site p4-suites.localhost --verbose run-tests --module crm_cskh.tests.test_ui_p3_pages_and_context --junit-xml-output /tmp/p4-junit-ui/test_ui_p3_pages_and_context.junit.xml"

          BACKEND_CID="$(docker compose -f deploy/images/compose.verify.yaml -p "${COMPOSE_PROJECT_NAME}" ps -q backend)"
          docker cp "${BACKEND_CID}:/tmp/p4-junit/." "$VERIFY_OUT/junit/"
          docker cp "${BACKEND_CID}:/tmp/p4-junit-ui/." "$VERIFY_OUT/junit-ui/"

          for inv in \
            deploy/dev/seed/g007_test_inventory.json \
            deploy/dev/seed/p1_test_inventory.json \
            deploy/dev/seed/p2_test_inventory.json \
            deploy/dev/seed/p3_test_inventory.json
          do
            name="$(basename "${inv}" .json)"
            python3 deploy/dev/seed/ci_junit_gate.py \
              --inventory "${inv}" \
              --xml-dir "$VERIFY_OUT/junit" \
              --out "$VERIFY_OUT/${name}-gate.json"
          done
          python3 deploy/dev/seed/ci_junit_gate.py \
            --inventory deploy/p3/ui_test_inventory.json \
            --xml-dir "$VERIFY_OUT/junit-ui" \
            --out "$VERIFY_OUT/p3-ui-gate.json"

      - name: Attest Build -> Verify same-digest chain
        shell: bash
        env:
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/p4-venv/bin/python" deploy/release/verify_digest_promotion.py \
            --manifest "$RUNNER_TEMP/p4-release-bundle/manifest/release-manifest.json" \
            --sig "$RUNNER_TEMP/p4-release-bundle/manifest/release-manifest.json.sig" \
            --public-key-env RELEASE_SIGNING_PUBLIC_KEY \
            --expected-scope production_candidate \
            --build-inspect "$RUNNER_TEMP/p4-release-bundle/build/image-inspect-summary.json" \
            --clean-site-report "$RUNNER_TEMP/p4-verify-evidence/clean-site-verify.json" \
            --compose-smoke-report "$RUNNER_TEMP/p4-verify-evidence/isolated-smoke-report.json" \
            --out "$RUNNER_TEMP/p4-verify-evidence/verify-stage-digest-attestation.json"

      - name: Upload verify-by-digest evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p4-verify-by-digest-${{ github.run_id }}
          path: ${{ runner.temp }}/p4-verify-evidence/
          if-no-files-found: warn
          retention-days: 90

  deploy-staging:
    name: Deploy identical @sha256 digest to Staging & attest running containers (G05)
    needs: [build-once-sign-and-push, verify-by-digest]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download signed release bundle & verify-by-digest evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p4-release-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/p4-release-bundle

      - name: Download verify-by-digest report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p4-verify-by-digest-${{ github.run_id }}
          path: ${{ runner.temp }}/p4-verify-evidence

      - name: Verify Staging host configuration & deploy identical @sha256 digest
        shell: bash
        env:
          APP_IMAGE_DIGEST: ${{ needs.build-once-sign-and-push.outputs.app_image_digest }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          STAGING_DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
          STAGING_ENV_FILE: ${{ vars.STAGING_ENV_FILE }}
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/p4-staging-attestation"
          mkdir -p "${OUT_DIR}"
          python3 -m venv "$RUNNER_TEMP/p4-venv"
          "$RUNNER_TEMP/p4-venv/bin/pip" install --no-cache-dir cryptography==44.0.2

          "$RUNNER_TEMP/p4-venv/bin/python" deploy/release/release_manifest.py verify \
            --manifest "$RUNNER_TEMP/p4-release-bundle/manifest/release-manifest.json" \
            --sig "$RUNNER_TEMP/p4-release-bundle/manifest/release-manifest.json.sig" \
            --public-key-env RELEASE_SIGNING_PUBLIC_KEY \
            --expected-image "${APP_IMAGE_DIGEST}" \
            --expected-scope production_candidate

          if [ -z "${STAGING_SSH_HOST}" ] || [ -z "${STAGING_SSH_USER}" ] || [ -z "${STAGING_SSH_PRIVATE_KEY}" ] || [ -z "${STAGING_DEPLOY_PATH}" ] || [ -z "${STAGING_ENV_FILE}" ]; then
            python3 - "${OUT_DIR}/blocked-staging-host.json" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path

          report = {
              "status": "BLOCKED",
              "blocker_id": "BLK-INFRA-01",
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "detail": (
                  "Staging VPS/host SSH credentials and paths are not yet provisioned in the "
                  "protected `staging` GitHub Environment."
              ),
          }
          Path(sys.argv[1]).write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2), file=sys.stderr)
          PY
            exit 1
          fi

          SSH_DIR="$RUNNER_TEMP/staging-ssh"
          mkdir -p "${SSH_DIR}"
          chmod 700 "${SSH_DIR}"
          printf '%s\n' "${STAGING_SSH_PRIVATE_KEY}" > "${SSH_DIR}/id_ed25519"
          chmod 600 "${SSH_DIR}/id_ed25519"
          printf '%s\n' "${STAGING_KNOWN_HOSTS}" > "${SSH_DIR}/known_hosts"
          chmod 600 "${SSH_DIR}/known_hosts"
          printf '%s\n' "${RELEASE_SIGNING_PUBLIC_KEY}" > "${OUT_DIR}/release-signing.pub"

          SSH_PORT="${STAGING_SSH_PORT:-22}"
          SSH_OPTS=(-i "${SSH_DIR}/id_ed25519" -p "${SSH_PORT}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${SSH_DIR}/known_hosts")
          SCP_OPTS=(-i "${SSH_DIR}/id_ed25519" -P "${SSH_PORT}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${SSH_DIR}/known_hosts")
          REMOTE_WORK="/tmp/cskh-staging-release-${GITHUB_RUN_ID}"

          ssh "${SSH_OPTS[@]}" "${STAGING_SSH_USER}@${STAGING_SSH_HOST}" "mkdir -p '${REMOTE_WORK}/out'"
          scp "${SCP_OPTS[@]}" \
            "$RUNNER_TEMP/p4-release-bundle/manifest/release-manifest.json" \
            "$RUNNER_TEMP/p4-release-bundle/manifest/release-manifest.json.sig" \
            "$RUNNER_TEMP/p4-release-bundle/build/image-inspect-summary.json" \
            "$RUNNER_TEMP/p4-verify-evidence/clean-site-verify.json" \
            "${OUT_DIR}/release-signing.pub" \
            "${STAGING_SSH_USER}@${STAGING_SSH_HOST}:${REMOTE_WORK}/"

          ssh "${SSH_OPTS[@]}" "${STAGING_SSH_USER}@${STAGING_SSH_HOST}" \
            "set -euo pipefail
             sed -i 's|^APP_IMAGE=.*|APP_IMAGE=${APP_IMAGE_DIGEST}|' '${STAGING_ENV_FILE}'
             sed -i 's|^PULL_POLICY=.*|PULL_POLICY=always|' '${STAGING_ENV_FILE}'
             sed -i 's|^MIGRATE_SITES=.*|MIGRATE_SITES=false|' '${STAGING_ENV_FILE}'
             bash '${STAGING_DEPLOY_PATH}/deploy/release/deploy_staging_by_digest.sh' \
               --manifest '${REMOTE_WORK}/release-manifest.json' \
               --sig '${REMOTE_WORK}/release-manifest.json.sig' \
               --public-key-file '${REMOTE_WORK}/release-signing.pub' \
               --env-file '${STAGING_ENV_FILE}' \
               --build-inspect '${REMOTE_WORK}/image-inspect-summary.json' \
               --clean-site-report '${REMOTE_WORK}/clean-site-verify.json' \
               --out-dir '${REMOTE_WORK}/out'"

          scp "${SCP_OPTS[@]}" \
            "${STAGING_SSH_USER}@${STAGING_SSH_HOST}:${REMOTE_WORK}/out/staging-digest-attestation.json" \
            "${STAGING_SSH_USER}@${STAGING_SSH_HOST}:${REMOTE_WORK}/out/staging-containers-inspect.json" \
            "${OUT_DIR}/"
          ssh "${SSH_OPTS[@]}" "${STAGING_SSH_USER}@${STAGING_SSH_HOST}" "rm -rf '${REMOTE_WORK}'" || true
          rm -rf "${SSH_DIR}"

      - name: Upload Staging digest attestation (G05)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p4-staging-attestation-${{ github.run_id }}
          path: ${{ runner.temp }}/p4-staging-attestation/
          if-no-files-found: warn
          retention-days: 90
