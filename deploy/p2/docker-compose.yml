# deploy/p2/docker-compose.yml
#
# Stack kiểm thử P2 UI — RIÊNG BIỆT so với stack P1 của Owner (p1.localhost:8120)
# và stack DEV (deploy/dev). Một site Frappe riêng (p2.localhost), cổng riêng, volume riêng.
# KHÔNG xóa volume của stack khác; KHÔNG publish DB/Redis ra host.
#
# Dùng:
#   cp .env.example .env   # rồi chỉnh nếu cần (KHÔNG commit .env)
#   docker compose up -d db redis-cache redis-queue bench

name: ${COMPOSE_PROJECT_NAME:-crm-cskh-p2-ui}

x-bench-common: &bench-common
  image: ${BENCH_IMAGE}
  working_dir: /workspace
  environment:
    DB_HOST: db
    DB_PORT: "3306"
    DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    REDIS_CACHE: redis://redis-cache:6379
    REDIS_QUEUE: redis://redis-queue:6379
    SITE_NAME: ${SITE_NAME:-p2.localhost}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    FRAPPE_TAG: ${FRAPPE_TAG}
    FRAPPE_SHA: ${FRAPPE_SHA}
    CRM_TAG: ${CRM_TAG}
    CRM_SHA: ${CRM_SHA}
    FRAPPE_DOCKER_SHA: ${FRAPPE_DOCKER_SHA}
    INSTALL_CSKH: ${INSTALL_CSKH:-1}
    # Vite dev port INSIDE the container must equal the published host port so
    # the realtime self-auth request to `Origin + /api/...` resolves inside.
    VITE_DEV_PORT: ${VITE_PORT:-8292}
    TZ: ${TZ:-Asia/Ho_Chi_Minh}
  networks:
    - backend

services:
  db:
    image: ${MARIADB_IMAGE}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - p2-ui-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 15s
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis-cache:
    image: ${REDIS_IMAGE}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - backend

  redis-queue:
    image: ${REDIS_IMAGE}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - p2-ui-redis-queue-data:/data
    networks:
      - backend

  bench:
    <<: *bench-common
    command: ["sleep", "infinity"]
    extra_hosts:
      - "${SITE_NAME:-p2.localhost}:127.0.0.1"
    volumes:
      - p2-ui-bench-workspace:/workspace
      # Worktree p2-ui mount read-only; đây là nguồn của app crm_cskh P2 UI.
      - ../../:/src:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-8220}:8000"
      - "127.0.0.1:${SOCKETIO_PORT:-9220}:9000"
      - "127.0.0.1:${VITE_PORT:-8292}:${VITE_PORT:-8292}"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

volumes:
  p2-ui-db-data:
  p2-ui-redis-queue-data:
  p2-ui-bench-workspace:

networks:
  backend:
    driver: bridge
